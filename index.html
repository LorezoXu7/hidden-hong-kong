<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c0392b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hidden HK">
<title>Hidden Hong Kong · 香港隐世角落</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Hidden Hong Kong","short_name":"HiddenHK","start_url":".","display":"standalone","background_color":"%23f7f3ec","theme_color":"%23c0392b","icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23c0392b%22/%3E%3Ctext x=%2250%22 y=%2268%22 font-size=%2255%22 text-anchor=%22middle%22 fill=%22white%22%3E港%3C/text%3E%3C/svg%3E","sizes":"any","type":"image/svg+xml"}]}'>
<style>
  :root{
    --bg:#f7f3ec; --card:#fff; --ink:#2a2622; --sub:#8a8175;
    --accent:#c0392b; --accent2:#e67e22; --gold:#c4a64a;
    --food:#c0392b; --view:#2e86ab; --culture:#7d5ba6;
    --line:#e8e0d2; --shadow:0 6px 24px rgba(50,40,30,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:520px;margin:0 auto;padding:0 0 80px}

  header{padding:24px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:10}
  .logo{display:flex;align-items:center;gap:10px}
  .logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:bold}
  .logo h1{font-size:20px;letter-spacing:1px}
  .logo p{font-size:12px;color:var(--sub)}
  .search{margin-top:14px;width:100%;padding:12px 16px;border-radius:24px;border:1px solid var(--line);background:var(--card);font-size:14px}
  .search:focus{outline:none;border-color:var(--accent)}
  .cats{display:flex;gap:8px;margin:14px 0 6px;overflow-x:auto;padding-bottom:4px}
  .cat{padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap;cursor:pointer;transition:.15s;color:#5a534a}
  .cat.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  .list{padding:0 20px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.15s;border:1px solid var(--line)}
  .card:active{transform:scale(.98)}
  .card .img{height:180px;background-size:cover;background-position:center;position:relative}
  .card .badge{position:absolute;top:12px;left:12px;padding:4px 12px;border-radius:12px;font-size:11px;color:#fff;font-weight:bold;letter-spacing:1px}
  .b-food{background:var(--food)} .b-view{background:var(--view)} .b-culture{background:var(--culture)}
  .card .save{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;border:none}
  .card .body{padding:14px 16px}
  .card h3{font-size:16px;margin-bottom:4px}
  .card .loc{font-size:12px;color:var(--sub);margin-bottom:6px}
  .card .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--gold);margin-bottom:6px}
  .card .desc{font-size:13px;color:#5a534a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* 弹窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:20px;animation:up .25s}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet .img{height:180px;border-radius:12px;background-size:cover;background-position:center;margin-bottom:14px}
  .sheet h2{font-size:20px;margin-bottom:6px}
  .sheet .tag{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;color:#fff;margin-right:6px}
  .sheet .info{font-size:13px;color:var(--sub);margin:10px 0}
  .sheet .info b{color:var(--ink)}
  .sheet .desc{font-size:14px;color:#4a443d;margin:10px 0}
  .sheet .btn-row{display:flex;gap:10px;margin:12px 0}
  .sheet .btn{padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:13px;cursor:pointer;flex:1;text-align:center;text-decoration:none;color:var(--ink)}
  .sheet .btn.map{background:#2e86ab;color:#fff;border:none}

  /* 评分 */
  .rating{display:flex;align-items:center;gap:4px;margin:10px 0}
  .rating .star{font-size:28px;cursor:pointer;color:#ddd;transition:.1s}
  .rating .star.on{color:#f5b301}
  .rating .num{font-size:13px;color:var(--sub);margin-left:8px}

  /* 评论 */
  .comments{margin:14px 0}
  .comments h4{font-size:14px;margin-bottom:8px}
  .comment{background:#f9f6f0;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px}
  .comment .who{font-size:11px;color:var(--sub);margin-bottom:2px}
  .cmt-input{display:flex;gap:8px;margin-top:10px}
  .cmt-input input{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px}
  .cmt-input input:focus{outline:none;border-color:var(--accent)}
  .cmt-input button{padding:10px 16px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:13px;cursor:pointer}

  .sheet .close{width:100%;padding:14px;border-radius:14px;border:none;background:var(--ink);color:#fff;font-size:15px;cursor:pointer;margin-top:12px}

  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 0;z-index:50}
  .nav button{background:none;border:none;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .nav button.active{color:var(--accent)}
  .nav .ic{font-size:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="mark">港</div>
      <div><h1>Hidden Hong Kong</h1><p>香港隐世角落 · 探索指南</p></div>
    </div>
    <input class="search" id="search" placeholder="搜索地点、美食、关键词...">
    <div class="cats" id="cats">
      <div class="cat active" data-cat="all">全部</div>
      <div class="cat" data-cat="food">🍜 隐藏美食</div>
      <div class="cat" data-cat="view">🏙 隐藏美景</div>
      <div class="cat" data-cat="culture">🏮 隐藏文化</div>
    </div>
  </header>

  <div class="list" id="list"></div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<div class="nav">
  <button class="active"><span class="ic">🏠</span>探索</button>
  <button id="nav-saved"><span class="ic">🔖</span>收藏</button>
  <button id="nav-about"><span class="ic">ℹ️</span>关于</button>
</div>

<script>
const DATA = [
  {id:1, cat:"food", title:"深水埗 · 大牌档牛腩面", loc:"深水埗 北河街", price:"HK$40", map:"https://www.google.com/maps/search/?api=1&query=深水埗北河街大牌檔", desc:"由同一家族经营40年的大牌档，牛腩面仍只要港币40元。凌晨仍坐满街坊，是深水埗最真实的烟火气。记得加一勺辣椒酱。", img:"https://images.unsplash.com/photo-1774270149411-59e20c04cbb6?w=800&q=80", color:"linear-gradient(135deg,#c0392b,#e67e22)"},
  {id:2, cat:"view", title:"西环泳棚 · 日落海傍", loc:"坚尼地城 域多利道", price:"免费", map:"https://www.google.com/maps/search/?api=1&query=西環泳棚", desc:"上世纪建成的木造泳棚，是香港仅存的几个之一。黄昏时分海面染金，比热门观景台安静得多，拍照打卡必到。", img:"https://images.unsplash.com/photo-1617154219393-1a84be367f57?w=800&q=80", color:"linear-gradient(135deg,#2e86ab,#38d9c4)"},
  {id:3, cat:"culture", title:"九龙城 · 侯王古庙", loc:"九龙城 联合道", price:"免费", map:"https://www.google.com/maps/search/?api=1&query=九龍城侯王古廟", desc:"逾百年历史的侯王古庙，藏在九龙城闹市之中。庙内的木雕与石湾公仔保存完好，是城市里难得的历史印记。", img:"https://images.unsplash.com/photo-1748621616756-8b68e32096c8?w=800&q=80", color:"linear-gradient(135deg,#7d5ba6,#b5838d)"},
  {id:4, cat:"food", title:"合益泰 · 肠粉", loc:"深水埗 桂林街", price:"HK$12", map:"https://www.google.com/maps/search/?api=1&query=合益泰小食", desc:"米其林推荐的平民肠粉，12元一份滑嫩米肠，淋上甜酱芝麻酱，是深水埗街坊的早餐回忆。", img:"https://images.unsplash.com/photo-1774270149411-59e20c04cbb6?w=800&q=80", color:"linear-gradient(135deg,#c0392b,#f39c12)"},
  {id:5, cat:"culture", title:"西营盘 · 艺里坊壁画", loc:"西营盘 忠正街", price:"免费", map:"https://www.google.com/maps/search/?api=1&query=西營盤藝里坊", desc:"本地艺术家的街头壁画群，把平凡的后巷变成露天画廊。每一幅都藏着香港故事，适合慢慢漫步发现。", img:"https://images.unsplash.com/photo-1748621616756-8b68e32096c8?w=800&q=80", color:"linear-gradient(135deg,#7d5ba6,#e84393)"},
  {id:6, cat:"view", title:"大馆 · 天台城市景观", loc:"中环 荷李活道", price:"免费", map:"https://www.google.com/maps/search/?api=1&query=大館", desc:"前中区警署建筑群活化而成的艺文空间，天台可眺望中环天际线，日夜景色各有味道。", img:"https://images.unsplash.com/photo-1617154219393-1a84be367f57?w=800&q=80", color:"linear-gradient(135deg,#2e86ab,#2c3e50)"},
  {id:7, cat:"culture", title:"上环 · 石板街与文武庙", loc:"上环 荷李活道", price:"免费", map:"https://www.google.com/maps/search/?api=1&query=上環文武廟", desc:"石板街是老香港的缩影，拾级而上便是香火鼎盛的文武庙。串起一段浓缩的港岛历史散步路线。", img:"https://images.unsplash.com/photo-1748621616756-8b68e32096c8?w=800&q=80", color:"linear-gradient(135deg,#7d5ba6,#6c5ce7)"},
  {id:8, cat:"view", title:"南丫岛 · 索罟湾渔村", loc:"离岛 南丫岛", price:"船票HK$18", map:"https://www.google.com/maps/search/?api=1&query=南丫島索罟灣", desc:"从中环坐船40分钟，就能逃离都市。索罟湾的渔村风光、海鲜街与远足径，是香港最治愈的隐世角落。", img:"https://images.unsplash.com/photo-1617154219393-1a84be367f57?w=800&q=80", color:"linear-gradient(135deg,#2e86ab,#00b894)"}
];

const CAT_NAMES = {food:"隐藏美食", view:"隐藏美景", culture:"隐藏文化"};
let curCat = "all";
let saved = JSON.parse(localStorage.getItem("hhk_saved") || "[]");
let ratings = JSON.parse(localStorage.getItem("hhk_ratings") || "{}");
let comments = JSON.parse(localStorage.getItem("hhk_comments") || "{}");

const list = document.getElementById("list");
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");

function starsHTML(d, size){
  const r = Math.round((ratings[d.id]||0)*2)/2;
  let s = '';
  for(let i=1;i<=5;i++){ s += `<span class="star ${i<=r?'on':''}" style="font-size:${size}px" onclick="rate(${d.id},${i})">★</span>`; }
  const cnt = comments[d.id]?.length || 0;
  return `<div class="rating">${s}<span class="num">${r||0}/5 · ${cnt}条评论</span></div>`;
}

function render(){
  const kw = document.getElementById("search").value.trim().toLowerCase();
  const items = DATA.filter(d => {
    const okCat = curCat === "all" || d.cat === curCat;
    const okKw = !kw || (d.title+d.loc+d.desc).toLowerCase().includes(kw);
    return okCat && okKw;
  });
  list.innerHTML = items.map(d => `
    <div class="card" onclick="openDetail(${d.id})">
      <div class="img" style="background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.25)),url(${d.img}) center/cover">
        <span class="badge b-${d.cat}">${CAT_NAMES[d.cat]}</span>
        <button class="save" onclick="event.stopPropagation();toggleSave(${d.id})">${saved.includes(d.id)?'❤️':'🤍'}</button>
      </div>
      <div class="body">
        <h3>${d.title}</h3>
        <div class="loc">📍 ${d.loc} · ${d.price}</div>
        <div class="meta">⭐ ${Math.round((ratings[d.id]||0)*10)/10||'暂无'} 评分 · 💬 ${comments[d.id]?.length||0} 评论</div>
        <div class="desc">${d.desc}</div>
      </div>
    </div>`).join("") || '<p style="text-align:center;color:#8a8175;padding:40px 0">没有找到相关角落，试试其他关键词～</p>';
}

function openDetail(id){
  const d = DATA.find(x=>x.id===id);
  const cmts = comments[d.id] || [];
  sheet.innerHTML = `
    <div class="img" style="background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.25)),url(${d.img}) center/cover"></div>
    <h2>${d.title}</h2>
    <div><span class="tag b-${d.cat}">${CAT_NAMES[d.cat]}</span></div>
    <div class="info">📍 <b>${d.loc}</b><br>💰 <b>${d.price}</b></div>
    ${starsHTML(d, 28)}
    <div class="desc">${d.desc}</div>
    <div class="btn-row">
      <a class="btn map" href="${d.map}" target="_blank">🗺️ 查看地图</a>
      <button class="btn" onclick="toggleSave(${d.id});openDetail(${d.id})">${saved.includes(d.id)?'❤️ 已收藏':'🤍 收藏'}</button>
    </div>
    <div class="comments">
      <h4>💬 评论 (${cmts.length})</h4>
      ${cmts.map(c=>`<div class="comment"><div class="who">${c.who} · ${c.time}</div>${c.text}</div>`).join("") || '<p style="font-size:12px;color:#8a8175">还没有评论，来抢沙发～</p>'}
      <div class="cmt-input">
        <input id="cmt-name" placeholder="昵称" style="width:90px">
        <input id="cmt-text" placeholder="说点什么...">
        <button onclick="addComment(${d.id})">发送</button>
      </div>
    </div>
    <button class="close" onclick="modal.classList.remove('show')">关闭</button>`;
  modal.classList.add("show");
}

function rate(id, v){
  ratings[id] = v;
  localStorage.setItem("hhk_ratings", JSON.stringify(ratings));
  openDetail(id);
  render();
}

function addComment(id){
  const name = document.getElementById("cmt-name").value.trim() || "匿名";
  const text = document.getElementById("cmt-text").value.trim();
  if(!text) return;
  comments[id] = comments[id] || [];
  comments[id].push({who:name, text:text, time:new Date().toLocaleDateString()});
  localStorage.setItem("hhk_comments", JSON.stringify(comments));
  openDetail(id);
  render();
}

function toggleSave(id){
  saved = saved.includes(id) ? saved.filter(x=>x!==id) : [...saved, id];
  localStorage.setItem("hhk_saved", JSON.stringify(saved));
  render();
}

document.getElementById("cats").addEventListener("click", e=>{
  const c = e.target.closest(".cat"); if(!c) return;
  curCat = c.dataset.cat;
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
  c.classList.add("active"); render();
});

document.getElementById("search").addEventListener("input", render);

document.getElementById("nav-saved").addEventListener("click", ()=>{
  const items = DATA.filter(d=>saved.includes(d.id));
  if(!items.length){ alert("还没有收藏任何角落哦～"); return; }
  list.innerHTML = items.map(d=>`
    <div class="card" onclick="openDetail(${d.id})">
      <div class="img" style="background:linear-gradient(rgba(0,0,0,.15),rgba(0,0,0,.25)),url(${d.img}) center/cover"><span class="badge b-${d.cat}">${CAT_NAMES[d.cat]}</span><button class="save" onclick="event.stopPropagation();toggleSave(${d.id})">❤️</button></div>
      <div class="body"><h3>${d.title}</h3><div class="loc">📍 ${d.loc} · ${d.price}</div></div>
    </div>`).join("");
});

document.getElementById("nav-about").addEventListener("click", ()=>{
  sheet.innerHTML = `
    <h2 style="margin-bottom:10px">关于 Hidden Hong Kong</h2>
    <div class="desc">这是一个香港隐世角落探索指南，收录了隐藏美食、美景与文化地标。我们希望带你发现旅游指南遗漏的、真实的香港。</div>
    <div class="info">📸 Instagram 系列：@hiddenhongkong<br>🎓 课程作业 · User-centred Design<br>💡 无痕游览，尊重社区</div>
    <button class="close" onclick="modal.classList.remove('show')">关闭</button>`;
  modal.classList.add("show");
});

modal.addEventListener("click", e=>{ if(e.target===modal) modal.classList.remove("show"); });

render();
</script>
</body>
</html>
